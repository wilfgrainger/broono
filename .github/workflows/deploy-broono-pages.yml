name: Validate and deploy Broono local edition

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test local-only app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run regression tests
        run: pnpm test

      - name: Build static site
        run: pnpm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Verify local-only artifact
        run: |
          grep -q 'broono-local-only-2026-08-02-v1' dist/index.html
          grep -q "connect-src 'none'" dist/index.html
          test "$(cat dist/CNAME)" = "broono.app"
          grep -q 'One-release service-worker kill switch' dist/sw.js
          test ! -d backend
          ! grep -R -E 'api\.broono\.app|VITE_API_URL|GoogleAuth|NativePurchases|D1Database' src dist package.json
          ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          ! grep -q 'com.android.vending.BILLING' android/app/src/main/AndroidManifest.xml

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish broono.app
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
