name = "broono-api"
main = "worker/index.ts"
compatibility_date = "2026-07-25"
workers_dev = true
preview_urls = true

[[routes]]
pattern = "api.broono.app"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "broono"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "db"

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://broono.app,https://www.broono.app"

# Set encrypted production values with:
# npx wrangler secret put GOOGLE_CLIENT_ID
# npx wrangler secret put SESSION_SECRET
